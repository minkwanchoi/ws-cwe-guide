# 의존성 갱신 알림. 워크플로 액션은 커밋 해시로, Python 패키지는 해시 잠금 파일로 고정했으므로 새 판이 나오면 끌어오기 요청으로 알려 준다.
# - 공개된 지 14일이 지난 판만 제안한다(cooldown). 갓 올라온 판이 악성으로 바뀌는 공급망 위험을 피하고, CONTRIBUTING.md '빌드 의존성'의 2주 원칙과 같다.
# - 생태계마다 한 달에 요청 하나로 묶는다(groups). 판을 올리는 요청을 받으면 scripts/lock_requirements.py로
#   requirements-lock.txt를 다시 만들어 OSV를 확인한 뒤 같은 요청에 넣는다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 2
