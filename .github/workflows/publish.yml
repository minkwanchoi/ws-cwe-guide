# 배포: main에 올리면 'dev' 판, v*.*.* 태그를 올리면 그 판(예: 1.0)을 'latest'로 GitHub Pages(gh-pages 브랜치)에 게시한다.
# 폐쇄망판: 같은 원천으로 파일로 여는 사이트와 단일 문서를 만들어 zip·SHA-256으로 묶는다(main은 워크플로 산출물, 태그는 릴리스 첨부).
# 권한은 작업마다 필요한 만큼만 준다. 빌드·점검(build)은 읽기 전용, gh-pages 게시(pages)와 릴리스(release)만 쓰기 권한을 받는다.
# 패키지는 해시를 고정한 requirements-lock.txt로만 설치한다(scripts/lock_requirements.py).
name: publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes --no-deps -r requirements-lock.txt
      - name: 판 번호 형식 확인
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION || { echo "VERSION은 숫자와 점(1.2.3)만 쓴다"; exit 1; }
      - name: 태그와 VERSION 대조(태그)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$(cat VERSION)" ]; then echo "태그($TAG)와 VERSION($(cat VERSION))이 다릅니다"; exit 1; fi
      - name: 원고 생성
        run: python scripts/build.py
      - name: 사이트 점검(엄격 모드, 내부 링크, 외부 자원)
        run: |
          mkdocs build --strict --site-dir /tmp/site-check
          python scripts/check_internal_links.py /tmp/site-check --dir-urls
          python scripts/check_offline.py /tmp/site-check
          python scripts/check_assets.py /tmp/site-check
      - name: 내려받기 파일 보관(폐쇄망판 빌드가 docs/를 다시 만들기 전에)
        run: mkdir -p dist && cp docs/downloads/*.xlsx dist/
      - name: 폐쇄망판 빌드·점검·묶음(사이트판·단일 문서판 → dist/*.zip, SHA256SUMS.txt)
        run: python scripts/site_build.py --offline   # 경고 0·외부 자원 0·내부 링크 0·자원 해시 확인 뒤 묶음
      - run: cp source/guide/changelog.md dist/release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline
          path: dist/

  pages:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # gh-pages 브랜치에 판별 사이트를 올린다
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0          # mike가 gh-pages 이력을 읽고 올린다
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes --no-deps -r requirements-lock.txt
      - name: 원고 생성
        run: python scripts/build.py
      - name: git 사용자 설정
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 개발판(dev) 게시
        if: github.ref == 'refs/heads/main'
        run: mike deploy --push --update-aliases dev
      - name: 정식판 게시(태그)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"            # v1.2.3 → 1.2.3
          MINOR="${TAG%.*}"                      # 1.2.3 → 1.2 (패치 판은 같은 minor 판을 덮어쓴다)
          mike deploy --push --update-aliases --title "v${TAG}" "$MINOR" latest
          mike set-default --push latest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # 릴리스를 만들고 파일을 첨부한다
      id-token: write      # 출처 증명(Sigstore) 서명
      attestations: write  # 출처 증명 저장
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: offline, path: dist }
      - name: 출처 증명(공개 저장소에서만 쓸 수 있다)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.xlsx
      - name: 릴리스 만들기와 파일 첨부
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            dist/guide-data.xlsx dist/cwe-phase-matrix.xlsx dist/*.zip dist/SHA256SUMS.txt
